# -----------------------------------------------------------------------------
# Deploy to your VPS over SSH when you push to main/master.
#
# GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   VPS_HOST       Your server host (e.g. 65.21.244.158)
#   VPS_USER       SSH user (e.g. root)
#   VPS_SSH_KEY    Private key (full PEM) that can SSH into the server
#   VPS_APP_PATH   Absolute path on the server to Full-project-cybrian-qs
#                  (the folder that contains docker-compose.yml), e.g.:
#                  /root/Testing-Module/Full-project-cybrian-qs
#
# One-time on the VPS (SSH as root or your user):
#   apt update && apt install -y git docker.io docker-compose-plugin
#   git clone https://github.com/<YOU>/<REPO>.git
#   cd <REPO>/Full-project-cybrian-qs
#   cp backend/.env.example backend/.env && nano backend/.env
#   cp .env.compose.example .env && nano .env
#   chmod +x scripts/vps-docker-update.sh
#   ./scripts/vps-docker-update.sh
#
# Then add the GitHub secrets above. On each git push to main/master (paths below),
# this workflow SSHs in, git pull (hard reset to origin), and runs the same Docker update script.
#
# Manual updates without Actions: SSH to server, cd VPS_APP_PATH, git pull, ./scripts/vps-docker-update.sh
# -----------------------------------------------------------------------------

name: Deploy VPS (Docker)

on:
  push:
    branches: [main, master]
    paths:
      - "Full-project-cybrian-qs/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git sync + Docker rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            BRANCH="${{ github.ref_name }}"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            bash scripts/vps-docker-update.sh
